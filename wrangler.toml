name = "personal-ai"
main = "src/index.js"
compatibility_date = "2026-10-21"
keep_vars = true

[vars]
VLLM_BASE_URL = "https://openrouter.ai/api/v1"
VLLM_MODEL = "qwen/qwen3.7-flash"

[[d1_databases]]
binding = "DB"
database_name = "personal-ai-db"
database_id = "8677305c-f61d-4925-aa63-c88f6ef107d1"

migrations_dir = "migrations"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
